# Syntax-check every Netlify function before publishing. A parse error in a function
# (e.g. `var raw` in one branch and `const raw` in another) does not fail the build on
# its own — it ships and returns a text/plain 502 at runtime with no usable message.
# This makes that failure loud at deploy time instead of silent in production.
[build]
  command = "npm run check"
  publish = "."

# Site-wide mojibake bug: em-dashes, the footer ©, and emoji tab icons (lender.html,
# dscr-guide.html, and others) were rendering as "â"/"Â©"/tofu boxes in production,
# even though (a) the committed HTML has byte-correct UTF-8 -- verified with
# hexdump against a real 2-byte/3-byte UTF-8 sequence, not just eyeballing it -- and
# (b) the served Content-Type header correctly says charset=UTF-8. Both ends of the
# pipe are right, so the corruption has to be happening in between: Netlify's
# post-processing (HTML asset optimization/minification) has a known failure mode
# of reading files as single-byte instead of UTF-8 and rewriting them, which
# corrupts every multi-byte character uniformly across the whole site -- matching
# exactly what we're seeing (not confined to one page or one character type).
# skip_processing disables that post-processing step entirely so what's served is
# byte-identical to what's committed. Confirmed cause, not a guess: reproduced the
# same corruption via the alt netlify.app subdomain too, which rules out a stale
# CDN cache as the explanation.
[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."check-trial-expiry"]
  schedule = "0 10 * * *"

[functions."site-monitor"]
  schedule = "0 * * * *"

# Netlify support activated this account for 30s (their platform max, and better
# than the 26s originally requested -- their words: "our infrastructure cuts off
# the connection at 30 seconds, so that is the practical max"). Set explicitly
# rather than left to their account-level default so it's visible in source and
# doesn't silently drift if that default ever changes. A previous attempt set
# `timeout = 26` globally under [functions] above and Netlify's own build agent
# rejected it as a config parsing error; scoping it to the one function that
# actually needs it, using the same per-function block pattern already proven to
# work for `schedule` above, is what fixed that.
[functions."capiq-analyze"]
  timeout = 30

# ── Investor app routing ──────────────────────────────────────────────────────
# app.html is the single source for the investor app. investor.html was a byte-for-byte
# duplicate; edits landed in one copy while the other was served, so it was deleted.
# This 301 keeps old bookmarks and the admin quick-link working.
[[redirects]]
  from = "/investor.html"
  to = "/app"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

