# Syntax-check every Netlify function before publishing. A parse error in a function
# (e.g. `var raw` in one branch and `const raw` in another) does not fail the build on
# its own — it ships and returns a text/plain 502 at runtime with no usable message.
# This makes that failure loud at deploy time instead of silent in production.
[build]
  command = "npm run check"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."check-trial-expiry"]
  schedule = "0 10 * * *"

[functions."site-monitor"]
  schedule = "0 * * * *"

# Inert until Netlify support activates the Pro-plan 26s bump for this site (support
# ticket filed). A previous attempt set `timeout = 26` globally under [functions]
# above and Netlify's own build agent rejected it as a config parsing error; scoping
# it to the one function that actually needs it, using the same per-function block
# pattern already proven to work for `schedule` above, is the fix.
[functions."capiq-analyze"]
  timeout = 26

# ── Investor app routing ──────────────────────────────────────────────────────
# app.html is the single source for the investor app. investor.html was a byte-for-byte
# duplicate; edits landed in one copy while the other was served, so it was deleted.
# This 301 keeps old bookmarks and the admin quick-link working.
[[redirects]]
  from = "/investor.html"
  to = "/app"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

