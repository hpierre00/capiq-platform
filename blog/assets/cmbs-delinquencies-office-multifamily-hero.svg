<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#f8fafc"/><text x="70" y="200" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#0f2240">CMBS Delinquencies Hit</text><text x="70" y="260" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#0f2240">8.02%, Highest</text><text x="70" y="320" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#0f2240">Since 2020</text><text x="70" y="400" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490">Commercial mortgage stress is broadening</text><text x="70" y="434" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490">beyond office into multifamily as</text><text x="70" y="468" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490">refinancing costs stay elevated.</text><rect x="750" y="410" width="58" height="220" fill="#0f2240" opacity=".85"/><rect x="840" y="300" width="58" height="330" fill="#0f2240" opacity=".85"/><rect x="930" y="370" width="58" height="260" fill="#0f2240" opacity=".85"/><rect x="1020" y="220" width="58" height="410" fill="#0f2240" opacity=".85"/><polyline points="760,520 830,460 890,480 960,390 1020,360 1090,260 1160,180" fill="none" stroke="#0e7490" stroke-width="6"/></svg>