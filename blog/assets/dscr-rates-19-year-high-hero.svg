<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2240"/>
      <stop offset="100%" stop-color="#1a3355"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>

  <!-- skyline motif, lower right, low opacity -->
  <g opacity="0.5">
    <rect x="880" y="420" width="46" height="220" fill="#0e7490" fill-opacity="0.28"/>
    <rect x="936" y="360" width="46" height="280" fill="#0e7490" fill-opacity="0.35"/>
    <rect x="992" y="450" width="46" height="190" fill="#0e7490" fill-opacity="0.28"/>
    <rect x="1048" y="300" width="46" height="340" fill="#0e7490" fill-opacity="0.42"/>
    <rect x="1104" y="400" width="46" height="240" fill="#0e7490" fill-opacity="0.28"/>
    <rect x="1160" y="340" width="46" height="300" fill="#0e7490" fill-opacity="0.35"/>
  </g>

  <!-- ascending rate line over the skyline -->
  <polygon points="860,560 940,520 1020,470 1100,400 1180,300 1180,640 860,640" fill="url(#area)"/>
  <polyline points="860,560 940,520 1020,470 1100,400 1180,300" fill="none" stroke="#0e7490" stroke-width="4" stroke-opacity="0.7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1180" cy="300" r="7" fill="#0e7490" fill-opacity="0.9"/>

  <!-- headline -->
  <text x="80" y="230" fill="#ffffff" font-size="58" font-weight="800">DSCR Rates Push</text>
  <text x="80" y="300" fill="#ffffff" font-size="58" font-weight="800">Past 8%</text>

  <!-- subheadline -->
  <text x="80" y="352" fill="#5fc9e3" font-size="26" font-weight="600">As the 10-year Treasury hits a 19-year high</text>

  <!-- kicker badge -->
  <rect x="80" y="90" width="230" height="34" rx="17" fill="#0e7490" fill-opacity="0.18" stroke="#0e7490" stroke-opacity="0.4"/>
  <text x="98" y="113" fill="#5fc9e3" font-size="14" font-weight="700" letter-spacing="1">CAPITAL INTELLIGENCE</text>
</svg>
