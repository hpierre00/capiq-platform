<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underlytix, Lender Deal Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:       #08090d;
  --surface:  #10121a;
  --surface2: #181c28;
  --border:   #242836;
  --text:     #e8eaf0;
  --muted:    #6b7394;
  --accent:   #4f8eff;
  --green:    #00e07a;
  --amber:    #f5a623;
  --red:      #ff4242;
  --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────── */
header {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo-mark {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #4f8eff, #00e07a);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff;
}
.logo-text {
  font-size: 15px; font-weight: 700; color: var(--text);
  letter-spacing: -0.3px;
}
.logo-badge {
  font-size: 10px; font-weight: 600;
  background: rgba(79,142,255,0.15);
  color: var(--accent);
  border: 1px solid rgba(79,142,255,0.3);
  padding: 2px 7px; border-radius: 4px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.spacer { flex: 1; }
.profile-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 7px;
}
.profile-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Layout ─────────────────────────────── */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────── */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-head h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.new-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.new-btn:hover { opacity: 0.85; }

.search-box {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.search-box input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 7px 11px;
  font-size: 13px;
}
.search-box input::placeholder { color: var(--muted); }
.search-box input:focus { outline: none; border-color: var(--accent); }

.deal-list { flex: 1; overflow-y: auto; padding: 8px; }
.deal-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.deal-item:hover { background: var(--surface2); border-color: var(--border); }
.deal-item.active { background: rgba(79,142,255,0.08); border-color: rgba(79,142,255,0.3); }
.deal-prop { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deal-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.verdict-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.v-approve { background: var(--green); }
.v-conditions { background: var(--amber); }
.v-decline { background: var(--red); }
.v-pending { background: var(--muted); }

.empty-list { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }

/* ── Main Chat ─────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  display: flex;
  gap: 12px;
  max-width: 720px;
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
}
.ai-avatar {
  background: linear-gradient(135deg, #4f8eff22, #00e07a22);
  border: 1px solid rgba(79,142,255,0.3);
  color: var(--accent);
}
.user-avatar {
  background: rgba(79,142,255,0.2);
  border: 1px solid rgba(79,142,255,0.4);
  color: #fff;
  font-size: 11px;
}

.bubble {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  max-width: 580px;
}
.ai-bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-top-left-radius: 3px;
  color: var(--text);
}
.user-bubble {
  background: rgba(79,142,255,0.15);
  border: 1px solid rgba(79,142,255,0.3);
  border-top-right-radius: 3px;
  color: var(--text);
}

/* Option chips */
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.opt-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.opt-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Typing indicator */
.typing { display: flex; gap: 4px; align-items: center; padding: 6px 0; }
.typing span {
  width: 7px; height: 7px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Decision card */
.decision-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-top: 4px;
  width: 100%;
  max-width: 640px;
}
.decision-verdict {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px;
}
.verdict-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.verdict-approve { background: rgba(0,224,122,0.12); border: 1px solid rgba(0,224,122,0.3); color: var(--green); }
.verdict-conditions { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.3); color: var(--amber); }
.verdict-decline { background: rgba(255,66,66,0.12); border: 1px solid rgba(255,66,66,0.3); color: var(--red); }

.decision-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.d-cell { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.d-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 4px; }
.d-val { font-size: 14px; font-weight: 600; color: var(--text); }
.d-val.good { color: var(--green); }
.d-val.warn { color: var(--amber); }
.d-val.bad { color: var(--red); }

.rationale { margin-bottom: 16px; }
.rationale h4 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px; }
.rationale ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.rationale li { font-size: 13px; color: var(--text); display: flex; gap: 8px; line-height: 1.5; }
.rationale li::before { content: ', '; color: var(--muted); flex-shrink: 0; }

.conditions-list { margin-bottom: 16px; }
.conditions-list h4 { font-size: 11px; font-weight: 600; color: var(--amber); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px; }
.conditions-list li { color: var(--amber); font-size: 13px; }
.conditions-list li::before { content: '→'; }

.action-row { display: flex; gap: 10px; }
.action-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: opacity 0.15s;
}
.action-btn:hover { opacity: 0.85; }
.btn-pdf { background: var(--accent); color: #fff; }
.btn-email { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
.btn-new { background: transparent; border: 1px solid var(--border); color: var(--muted); }

/* ── Chat Input ─────────────────────────────── */
.input-bar {
  padding: 16px 32px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-wrap { flex: 1; position: relative; }
.chat-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  min-height: 46px;
  max-height: 140px;
  line-height: 1.5;
}
.chat-input::placeholder { color: var(--muted); }
.chat-input:focus { outline: none; border-color: var(--accent); }

.send-btn {
  width: 46px; height: 46px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Profile Modal ─────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 440px;
  max-width: 90vw;
}
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.modal p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 7px; }
.field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 9px;
  padding: 10px 14px;
  font-size: 14px;
}
.field input:focus { outline: none; border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }
.modal-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.modal-btn:hover { opacity: 0.85; }

/* Processing animation */
.processing {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  color: var(--muted);
}
.proc-ring {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Profile Setup Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h2>Set Up Your Lender Profile</h2>
    <p>Your name and company will auto-populate on every assessment report you generate.</p>
    <div class="field">
      <label>Lender / Company Name</label>
      <input type="text" id="p-company" placeholder="e.g. Sunrise Capital Partners" />
    </div>
    <div class="field">
      <label>Your Name (Loan Officer)</label>
      <input type="text" id="p-name" placeholder="e.g. Jane Smith" />
    </div>
    <div class="field">
      <label>Your Email</label>
      <input type="email" id="p-email" placeholder="e.g. jane@sunrise.com" />
    </div>
    <button class="modal-btn" onclick="saveProfile()">Save &amp; Continue →</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-mark">U</div>
    <span class="logo-text">Underlytix</span>
    <span class="logo-badge">Lender</span>
  </div>
  <div class="spacer"></div>
  <button class="profile-btn" onclick="editProfile()">
    <span>⚙</span> <span id="header-name">Profile</span>
  </button>
</header>

<!-- App -->
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-head">
      <h3>Deal History</h3>
      <button class="new-btn" onclick="newAssessment()">+ New</button>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search by folio or address…" id="deal-search" oninput="filterDeals()" />
    </div>
    <div class="deal-list" id="deal-list">
      <div class="empty-list">No assessments yet.<br>Start a new deal above.</div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main">
    <div class="chat-area" id="chat"></div>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          class="chat-input"
          id="user-input"
          placeholder="Type a folio number, address, or answer…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<script>
/* ─── Profile ─────────────────────────────────────── */
let profile = JSON.parse(localStorage.getItem('ul_profile') || 'null');

function saveProfile() {
  const co = document.getElementById('p-company').value.trim();
  const nm = document.getElementById('p-name').value.trim();
  const em = document.getElementById('p-email').value.trim();
  if (!co || !nm) { alert('Please fill in company and your name.'); return; }
  profile = { company: co, name: nm, email: em };
  localStorage.setItem('ul_profile', JSON.stringify(profile));
  document.getElementById('header-name').textContent = nm;
  document.getElementById('profileModal').classList.add('hidden');
  startGreeting();
}

function editProfile() {
  if (profile) {
    document.getElementById('p-company').value = profile.company;
    document.getElementById('p-name').value    = profile.name;
    document.getElementById('p-email').value   = profile.email;
  }
  document.getElementById('profileModal').classList.remove('hidden');
}

/* ─── State Machine ──────────────────────────────── */
const S = {
  GREETING:       'greeting',
  PROPERTY:       'property',
  LOAN_TYPE:      'loan_type',
  CLIENT_NAME:    'client_name',
  BORROWER_NAME:  'borrower_name',
  DEAL_BASICS:    'deal_basics',
  DOWN_PAYMENT:   'down_payment',
  // product branches
  DSCR_RENT:      'dscr_rent',
  DSCR_EXPENSES:  'dscr_expenses',
  BRIDGE_VALUE:   'bridge_value',
  BRIDGE_EXIT:    'bridge_exit',
  FLIP_ARV:       'flip_arv',
  FLIP_REHAB:     'flip_rehab',
  FLIP_EXP:       'flip_exp',
  LAND_ZONING:    'land_zoning',
  LAND_EXIT:      'land_exit',
  GND_BUDGET:     'gnd_budget',
  GND_PERMITS:    'gnd_permits',
  PRIVATE_EXIT:   'private_exit',
  PRIVATE_TERM:   'private_term',
  CREDIT_SCORE:   'credit_score',
  PROCESSING:     'processing',
  DECISION:       'decision',
};

let state = S.GREETING;
let deal  = {};          // collected deal data
let deals = JSON.parse(localStorage.getItem('ul_deals') || '[]');

/* ─── Chat Engine ────────────────────────────────── */
const chat = document.getElementById('chat');

function addAI(html, options = []) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = `
    <div class="msg-avatar ai-avatar">AI</div>
    <div>
      <div class="bubble ai-bubble">${html}</div>
      ${options.length ? `<div class="options">${options.map(o =>
        `<button class="opt-chip" onclick="pickOption('${o.replace(/'/g,"&#39;")}')">${o}</button>`
      ).join('')}</div>` : ''}
    </div>
  `;
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `
    <div class="msg-avatar user-avatar">${(profile?.name||'ME')[0].toUpperCase()}</div>
    <div class="bubble user-bubble">${text}</div>
  `;
  chat.appendChild(wrap);
  scrollBottom();
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = `
    <div class="msg-avatar ai-avatar">AI</div>
    <div class="bubble ai-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function typed(ms) { return new Promise(r => setTimeout(r, ms)); }

async function aiSay(html, options = [], delay = 600) {
  const t = addTyping();
  await typed(delay);
  t.remove();
  addAI(html, options);
}

function pickOption(val) {
  // Remove option chips after pick
  document.querySelectorAll('.opt-chip').forEach(b => {
    b.parentElement.remove();
  });
  addUser(val);
  process(val);
}

/* ─── Input Handling ─────────────────────────────── */
function send() {
  const inp = document.getElementById('user-input');
  const val = inp.value.trim();
  if (!val || state === S.PROCESSING || state === S.DECISION) return;
  inp.value = '';
  autoResize(inp);
  addUser(val);
  process(val);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

/* ─── State Transitions ──────────────────────────── */
async function process(input) {
  setInputEnabled(false);
  const v = input.trim();

  switch (state) {

    case S.PROPERTY: {
      deal.propertyRaw = v;
      // Detect folio vs address
      deal.isFolio = /^\d{2}-\d{2}-\d{2}/.test(v) || /^\d{6,}$/.test(v);
      deal.address = v;
      const label = deal.isFolio ? `folio <strong>${v}</strong>` : `<strong>${v}</strong>`;
      state = S.LOAN_TYPE;
      await aiSay(
        `Got it, pulling records for ${label}. What type of financing is the borrower seeking?`,
        ['Private Money / Hard Money','DSCR - Rental Income Based','Bridge Loan',
         'Fix &amp; Flip','Ground-Up Construction','Land Loan','Commercial / Mixed-Use']
      );
      break;
    }

    case S.LOAN_TYPE: {
      deal.loanType = normalizeLoanType(v);
      state = S.CLIENT_NAME;
      await aiSay(`Got it, <strong>${deal.loanType}</strong>. Who is the client or broker submitting this deal? (Leave blank if direct borrower.)`);
      break;
    }

    case S.CLIENT_NAME: {
      deal.clientName = v === '' || v.toLowerCase() === 'n/a' || v.toLowerCase() === 'direct' ? '(Direct Borrower)' : v;
      state = S.BORROWER_NAME;
      await aiSay(`What is the borrower's legal name or entity name?`);
      break;
    }

    case S.BORROWER_NAME: {
      deal.borrowerName = v;
      state = S.DEAL_BASICS;
      await aiSay(`What is the purchase price or current appraised value of the property? (e.g. "$610,000" or "610k")`);
      break;
    }

    case S.DEAL_BASICS: {
      deal.purchasePrice = parseMoney(v);
      if (!deal.purchasePrice) {
        await aiSay(`I didn't catch that, can you re-enter the purchase price? (e.g. $610,000 or 610k)`, [], 300);
        break;
      }
      state = S.DOWN_PAYMENT;
      await aiSay(`How much is the borrower putting down? (Enter dollar amount or percentage, e.g. "$110,000" or "18%")`);
      break;
    }

    case S.DOWN_PAYMENT: {
      const raw = v;
      if (raw.includes('%')) {
        const pct = parseFloat(raw) / 100;
        deal.downPayment = Math.round(deal.purchasePrice * pct);
      } else {
        deal.downPayment = parseMoney(raw);
      }
      deal.loanAmount = deal.purchasePrice - deal.downPayment;
      deal.ltv        = deal.loanAmount / deal.purchasePrice;

      // Branch to product-specific questions
      state = productBranch(deal.loanType);
      await productQuestion(deal.loanType);
      break;
    }

    // ── DSCR ──
    case S.DSCR_RENT: {
      deal.monthlyRent = parseMoney(v);
      state = S.DSCR_EXPENSES;
      await aiSay(`What are the estimated monthly operating expenses? (taxes, insurance, management, maintenance, skip HOA if none). Rough estimate is fine.`);
      break;
    }
    case S.DSCR_EXPENSES: {
      deal.monthlyExpenses = parseMoney(v) || (deal.monthlyRent * 0.35);
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Bridge ──
    case S.BRIDGE_VALUE: {
      deal.currentValue = parseMoney(v);
      state = S.BRIDGE_EXIT;
      await aiSay(`What's the exit strategy, <strong>sale</strong> or <strong>refinance</strong>? And what's the target timeframe?`,
        ['Sale, 6 months', 'Sale, 12 months', 'Refinance, 12 months', 'Refinance, 18-24 months']);
      break;
    }
    case S.BRIDGE_EXIT: {
      deal.exitStrategy = v;
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Fix & Flip ──
    case S.FLIP_ARV: {
      deal.arv = parseMoney(v);
      state = S.FLIP_REHAB;
      await aiSay(`What is the estimated renovation / rehab budget?`);
      break;
    }
    case S.FLIP_REHAB: {
      deal.rehabBudget = parseMoney(v);
      state = S.FLIP_EXP;
      await aiSay(`How many fix-and-flip projects has this borrower completed in the last 24 months?`,
        ['0 (First-timer)', '1-2 Projects', '3-5 Projects', '6+ Projects']);
      break;
    }
    case S.FLIP_EXP: {
      deal.flipExperience = v;
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Land ──
    case S.LAND_ZONING: {
      deal.zoning = v;
      state = S.LAND_EXIT;
      await aiSay(`What's the borrower's exit strategy for this land?`,
        ['Hold - Sell Later', 'Develop - Build Residential', 'Develop - Build Commercial', 'Agricultural Use']);
      break;
    }
    case S.LAND_EXIT: {
      deal.exitStrategy = v;
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Ground-Up ──
    case S.GND_BUDGET: {
      deal.constructionBudget = parseMoney(v);
      deal.totalCost = (deal.purchasePrice || 0) + deal.constructionBudget;
      state = S.GND_PERMITS;
      await aiSay(`Does the borrower have approved plans and permits, or are they pre-permit?`,
        ['Permits Approved', 'Plans Submitted - Pending', 'Pre-Permit / Pre-Entitlement']);
      break;
    }
    case S.GND_PERMITS: {
      deal.permitStatus = v;
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Private Money ──
    case S.PRIVATE_EXIT: {
      deal.exitStrategy = v;
      state = S.PRIVATE_TERM;
      await aiSay(`What loan term is the borrower looking for?`,
        ['6 Months', '12 Months', '18 Months', '24 Months']);
      break;
    }
    case S.PRIVATE_TERM: {
      deal.loanTerm = v;
      state = S.CREDIT_SCORE;
      await creditQuestion();
      break;
    }

    // ── Credit / Final ──
    case S.CREDIT_SCORE: {
      deal.creditScore = v;
      await renderDecision();
      break;
    }

    default:
      break;
  }

  setInputEnabled(state !== S.DECISION && state !== S.PROCESSING);
}

function setInputEnabled(yes) {
  document.getElementById('user-input').disabled = !yes;
  document.getElementById('send-btn').disabled   = !yes;
}

/* ─── Product Branch Logic ───────────────────────── */
function normalizeLoanType(raw) {
  const r = raw.toLowerCase();
  if (r.includes('dscr') || r.includes('rental')) return 'DSCR - Rental Income Based';
  if (r.includes('bridge'))                         return 'Bridge Loan';
  if (r.includes('flip'))                           return 'Fix & Flip';
  if (r.includes('ground') || r.includes('const'))  return 'Ground-Up Construction';
  if (r.includes('land'))                           return 'Land Loan';
  if (r.includes('commercial') || r.includes('mixed')) return 'Commercial / Mixed-Use';
  return 'Private Money / Hard Money';
}

function productBranch(type) {
  const t = type.toLowerCase();
  if (t.includes('dscr'))    return S.DSCR_RENT;
  if (t.includes('bridge'))  return S.BRIDGE_VALUE;
  if (t.includes('flip'))    return S.FLIP_ARV;
  if (t.includes('land'))    return S.LAND_ZONING;
  if (t.includes('ground'))  return S.GND_BUDGET;
  return S.PRIVATE_EXIT; // private money + commercial default
}

async function productQuestion(type) {
  const t = type.toLowerCase();
  if (t.includes('dscr')) {
    await aiSay(`For DSCR underwriting I need the income figures. What is the <strong>monthly gross rental income</strong> for this property? (Actual if leased, market rate if vacant.)`);
  } else if (t.includes('bridge')) {
    await aiSay(`What is the current <strong>as-is value</strong> of the property? (Appraisal or market estimate is fine.)`);
  } else if (t.includes('flip')) {
    await aiSay(`What is the projected <strong>After-Repair Value (ARV)</strong>?`);
  } else if (t.includes('land')) {
    await aiSay(`What is the current <strong>zoning designation</strong> of the land? (e.g. A-1, RR-5, C-1, or "unzoned")`);
  } else if (t.includes('ground')) {
    await aiSay(`What is the total <strong>construction budget</strong>, excluding the land cost?`);
  } else {
    // private money / commercial
    await aiSay(`What is the borrower's <strong>exit strategy</strong> for this loan?`,
      ['Sale of Property', 'Cash-Out Refinance', 'Development / Build-Out', 'Business Revenue']);
  }
}

async function creditQuestion() {
  state = S.CREDIT_SCORE;
  await aiSay(`Almost there. What is the borrower's estimated <strong>credit score range</strong>?`,
    ['Below 620', '620-660', '660-700', '700-740', 'Above 740']);
}

/* ─── Decision Engine ────────────────────────────── */
async function renderDecision() {
  state = S.PROCESSING;
  setInputEnabled(false);

  // Show processing
  const proc = document.createElement('div');
  proc.className = 'msg ai';
  proc.innerHTML = `
    <div class="msg-avatar ai-avatar">AI</div>
    <div class="processing"><div class="proc-ring"></div>Running underwriting analysis…</div>
  `;
  chat.appendChild(proc);
  scrollBottom();
  await typed(2200);
  proc.remove();

  // Compute decision
  const d = computeDecision(deal);
  deal.decision     = d.verdict;
  deal.decisionData = d;
  deal.date         = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  // Save to history
  const rec = {
    id:        Date.now(),
    address:   deal.address,
    loanType:  deal.loanType,
    borrower:  deal.borrowerName,
    verdict:   d.verdict,
    date:      deal.date,
    deal:      { ...deal },
  };
  deals.unshift(rec);
  localStorage.setItem('ul_deals', JSON.stringify(deals.slice(0, 50)));
  renderSidebar();

  // Render decision card
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';

  const verdictClass = d.verdict === 'APPROVED' ? 'verdict-approve' :
                       d.verdict === 'APPROVED WITH CONDITIONS' ? 'verdict-conditions' : 'verdict-decline';
  const verdictIcon  = d.verdict === 'APPROVED' ? '✓' :
                       d.verdict === 'APPROVED WITH CONDITIONS' ? '⚑' : '✗';

  const metricsHTML = d.metrics.map(m => `
    <div class="d-cell">
      <div class="d-label">${m.label}</div>
      <div class="d-val ${m.color}">${m.value}</div>
    </div>
  `).join('');

  const condHTML = d.conditions.length ? `
    <div class="conditions-list">
      <h4>Conditions</h4>
      <ul>${d.conditions.map(c => `<li>${c}</li>`).join('')}</ul>
    </div>
  ` : '';

  wrap.innerHTML = `
    <div class="msg-avatar ai-avatar">AI</div>
    <div style="flex:1">
      <div class="bubble ai-bubble" style="margin-bottom:12px">
        Underwriting complete. Here is the assessment for <strong>${deal.address}</strong>:
      </div>
      <div class="decision-card">
        <div class="decision-verdict">
          <div class="verdict-badge ${verdictClass}">${verdictIcon} ${d.verdict}</div>
        </div>
        <div class="decision-grid">${metricsHTML}</div>
        <div class="rationale">
          <h4>Rationale</h4>
          <ul>${d.rationale.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
        ${condHTML}
        <div class="action-row">
          <button class="action-btn btn-pdf" onclick="downloadPDF()">⬇ Download PDF Report</button>
          <button class="action-btn btn-email" onclick="emailReport()">✉ Email Report</button>
          <button class="action-btn btn-new" onclick="newAssessment()">+ New Deal</button>
        </div>
      </div>
    </div>
  `;
  chat.appendChild(wrap);
  scrollBottom();

  state = S.DECISION;
}

function computeDecision(d) {
  const type = (d.loanType || '').toLowerCase();
  const ltv  = d.ltv || 0;
  const creditNum = creditToNum(d.creditScore || '');

  let verdict    = 'APPROVED';
  let rationale  = [];
  let conditions = [];
  let metrics    = [];

  const ltvPct = (ltv * 100).toFixed(1) + '%';
  const ltvColor = ltv <= 0.65 ? 'good' : ltv <= 0.75 ? 'warn' : 'bad';

  metrics.push({ label: 'Loan-to-Value (LTV)', value: ltvPct, color: ltvColor });
  metrics.push({ label: 'Loan Amount', value: fmt(d.loanAmount), color: '' });
  metrics.push({ label: 'Purchase Price', value: fmt(d.purchasePrice), color: '' });
  metrics.push({ label: 'Down Payment', value: fmt(d.downPayment) + ` (${((d.downPayment/d.purchasePrice)*100).toFixed(0)}%)`, color: ltvColor });

  if (type.includes('dscr')) {
    const rate = ltv <= 0.65 ? 0.075 : ltv <= 0.75 ? 0.085 : 0.095;
    const mr   = rate / 12;
    const n    = 360;
    const pmt  = d.loanAmount * (mr * Math.pow(1+mr,n)) / (Math.pow(1+mr,n)-1);
    const ads  = pmt * 12;
    const noi  = (d.monthlyRent * 12 * 0.95) - (d.monthlyExpenses * 12);
    const dscr = noi / ads;
    const dscrColor = dscr >= 1.25 ? 'good' : dscr >= 1.0 ? 'warn' : 'bad';
    metrics.push({ label: 'DSCR', value: dscr.toFixed(2) + 'x', color: dscrColor });
    metrics.push({ label: 'Est. Annual NOI', value: fmt(noi), color: dscrColor });

    if (dscr >= 1.25 && ltv <= 0.75 && creditNum >= 660) {
      verdict = 'APPROVED';
      rationale.push(`DSCR of ${dscr.toFixed(2)}x exceeds the 1.25x threshold, property cash-flows adequately.`);
      rationale.push(`LTV of ${ltvPct} is within program limits.`);
    } else if (dscr >= 1.0 || ltv <= 0.80) {
      verdict = 'APPROVED WITH CONDITIONS';
      if (dscr < 1.25) { rationale.push(`DSCR of ${dscr.toFixed(2)}x meets minimum (1.0x) but is below the preferred 1.25x, marginal cash flow.`); conditions.push('Provide executed lease agreements and 12-month rental history.'); }
      if (ltv > 0.75)  { rationale.push(`LTV of ${ltvPct} exceeds standard 75% for DSCR programs.`); conditions.push('Borrower to provide additional reserves (6 months PITIA).'); }
      if (creditNum < 660) { conditions.push('Credit score below 660, requires compensating factors or rate adjustment.'); }
    } else {
      verdict = 'DECLINE';
      if (dscr < 1.0) rationale.push(`DSCR of ${dscr.toFixed(2)}x is below the minimum 1.0x, property does not self-service the debt.`);
      if (ltv > 0.80) rationale.push(`LTV of ${ltvPct} exceeds maximum 80% for DSCR product.`);
    }

  } else if (type.includes('flip')) {
    const ltc    = (d.loanAmount + (d.rehabBudget||0)) / (d.purchasePrice + (d.rehabBudget||0));
    const ltvArv = d.loanAmount / (d.arv || d.purchasePrice);
    const expNum = expToNum(d.flipExperience || '');
    metrics.push({ label: 'ARV', value: fmt(d.arv), color: '' });
    metrics.push({ label: 'Rehab Budget', value: fmt(d.rehabBudget), color: '' });
    const ltvArvColor = ltvArv <= 0.70 ? 'good' : ltvArv <= 0.80 ? 'warn' : 'bad';
    metrics.push({ label: 'Loan / ARV', value: (ltvArv*100).toFixed(1)+'%', color: ltvArvColor });

    if (ltvArv <= 0.70 && ltv <= 0.85 && expNum >= 1) {
      verdict = 'APPROVED';
      rationale.push(`Loan-to-ARV of ${(ltvArv*100).toFixed(1)}% is within the 70% threshold.`);
      rationale.push(`Borrower has documented fix-and-flip experience.`);
    } else if (ltvArv <= 0.80 || expNum === 0) {
      verdict = 'APPROVED WITH CONDITIONS';
      if (ltvArv > 0.70) { rationale.push(`Loan-to-ARV of ${(ltvArv*100).toFixed(1)}% exceeds preferred 70%.`); conditions.push('Independent appraisal confirming ARV required prior to close.'); }
      if (expNum === 0) { rationale.push(`First-time flipper, elevated execution risk.`); conditions.push('Signed GC contract with licensed contractor and draw schedule required.'); conditions.push('Borrower to demonstrate sufficient liquidity to carry project.'); }
    } else {
      verdict = 'DECLINE';
      rationale.push(`Loan-to-ARV of ${(ltvArv*100).toFixed(1)}% exceeds maximum 80%, insufficient equity cushion on exit.`);
    }

  } else if (type.includes('land')) {
    metrics.push({ label: 'Zoning', value: d.zoning || 'Not Provided', color: '' });
    metrics.push({ label: 'Exit Strategy', value: d.exitStrategy || 'Unknown', color: '' });
    const hasEntitle = !(d.zoning||'').toLowerCase().includes('unzoned');

    if (ltv <= 0.50 && hasEntitle) {
      verdict = 'APPROVED';
      rationale.push(`LTV of ${ltvPct} is within the 50% threshold for raw land.`);
      rationale.push(`Zoning designation indicates entitled land, lower risk profile.`);
    } else if (ltv <= 0.65) {
      verdict = 'APPROVED WITH CONDITIONS';
      rationale.push(`LTV of ${ltvPct} is within the 65% range for land with a clear exit.`);
      if (!hasEntitle) { conditions.push('Unzoned or unclear entitlement, provide county zoning confirmation letter.'); }
      conditions.push('Phase 1 Environmental Site Assessment required.');
      conditions.push('Survey confirming legal acreage required.');
    } else {
      verdict = 'DECLINE';
      rationale.push(`LTV of ${ltvPct} exceeds the 65% maximum for raw land loans, insufficient equity position.`);
    }

  } else if (type.includes('bridge')) {
    metrics.push({ label: 'As-Is Value', value: fmt(d.currentValue), color: '' });
    metrics.push({ label: 'Exit Strategy', value: d.exitStrategy || 'Unknown', color: '' });
    const ltvAsIs = d.loanAmount / (d.currentValue || d.purchasePrice);
    const ltvAsIsColor = ltvAsIs <= 0.65 ? 'good' : ltvAsIs <= 0.75 ? 'warn' : 'bad';
    metrics.push({ label: 'LTV (As-Is)', value: (ltvAsIs*100).toFixed(1)+'%', color: ltvAsIsColor });
    const exitClear = (d.exitStrategy||'').toLowerCase().includes('sale') || (d.exitStrategy||'').toLowerCase().includes('refinance');

    if (ltvAsIs <= 0.65 && exitClear) {
      verdict = 'APPROVED';
      rationale.push(`LTV against as-is value is ${(ltvAsIs*100).toFixed(1)}%, strong equity position.`);
      rationale.push(`Clear exit via ${d.exitStrategy.toLowerCase()} with defined timeline.`);
    } else if (ltvAsIs <= 0.75) {
      verdict = 'APPROVED WITH CONDITIONS';
      if (ltvAsIs > 0.65) { rationale.push(`LTV of ${(ltvAsIs*100).toFixed(1)}% is slightly elevated for bridge.`); conditions.push('Rate adjustment of +0.5-1% to compensate for LTV.'); }
      if (!exitClear) { conditions.push('Exit strategy must be documented (signed PSA or refi commitment letter) prior to close.'); }
    } else {
      verdict = 'DECLINE';
      rationale.push(`LTV of ${(ltvAsIs*100).toFixed(1)}% on as-is value exceeds 75% maximum for bridge program.`);
    }

  } else if (type.includes('ground')) {
    const totalCost = (d.purchasePrice||0) + (d.constructionBudget||0);
    const ltcFull   = d.loanAmount / totalCost;
    const permitOk  = (d.permitStatus||'').toLowerCase().includes('approved');
    metrics.push({ label: 'Total Project Cost', value: fmt(totalCost), color: '' });
    metrics.push({ label: 'Construction Budget', value: fmt(d.constructionBudget), color: '' });
    metrics.push({ label: 'Loan-to-Cost (LTC)', value: (ltcFull*100).toFixed(1)+'%', color: ltcFull<=0.75?'good':ltcFull<=0.85?'warn':'bad' });
    metrics.push({ label: 'Permit Status', value: d.permitStatus || 'Unknown', color: permitOk?'good':'warn' });

    if (ltcFull <= 0.75 && permitOk) {
      verdict = 'APPROVED';
      rationale.push(`LTC of ${(ltcFull*100).toFixed(1)}% is within the 75% ground-up construction threshold.`);
      rationale.push(`Permits approved, project is ready to break ground.`);
    } else if (ltcFull <= 0.85) {
      verdict = 'APPROVED WITH CONDITIONS';
      conditions.push('Construction loan to fund via draw schedule with independent inspector sign-off.');
      if (!permitOk) conditions.push('Permits must be issued before first construction draw.');
      if (ltcFull > 0.75) conditions.push(`LTC at ${(ltcFull*100).toFixed(1)}%, require GC fixed-price contract to cap cost overrun exposure.`);
    } else {
      verdict = 'DECLINE';
      rationale.push(`LTC of ${(ltcFull*100).toFixed(1)}% exceeds the 85% maximum for ground-up, insufficient borrower equity in the deal.`);
    }

  } else {
    // Private money / commercial default
    metrics.push({ label: 'Exit Strategy', value: d.exitStrategy || 'Unknown', color: '' });
    metrics.push({ label: 'Loan Term', value: d.loanTerm || 'Not Specified', color: '' });
    const exitClear = (d.exitStrategy||'').toLowerCase() !== 'unknown' && d.exitStrategy;

    if (ltv <= 0.65 && exitClear && creditNum >= 620) {
      verdict = 'APPROVED';
      rationale.push(`LTV of ${ltvPct} is within the 65% private money threshold, strong collateral coverage.`);
      rationale.push(`Clear exit strategy identified: ${d.exitStrategy}.`);
    } else if (ltv <= 0.75) {
      verdict = 'APPROVED WITH CONDITIONS';
      if (ltv > 0.65) { rationale.push(`LTV of ${ltvPct} exceeds preferred 65% for private money, higher risk tier.`); conditions.push('Rate adjustment of +1-2% to reflect elevated LTV.'); }
      if (!exitClear) { conditions.push('Exit strategy must be documented and time-bound.'); }
      if (creditNum < 620) { conditions.push('Credit below 620, compensating factors required (additional collateral, guarantor, or cross-collateralization).'); }
    } else {
      verdict = 'DECLINE';
      rationale.push(`LTV of ${ltvPct} exceeds the 75% maximum for private money lending on this asset class.`);
      rationale.push(`Borrower equity position is insufficient to protect lender in a distressed exit.`);
    }
  }

  if (!rationale.length) rationale.push('Deal does not meet program criteria based on submitted parameters.');

  return { verdict, rationale, conditions, metrics };
}

/* ─── PDF Generation ─────────────────────────────── */
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = 612, M = 56;
  let y = M;

  const color = deal.decision === 'APPROVED'                ? [0, 178, 94]  :
                deal.decision === 'APPROVED WITH CONDITIONS' ? [200, 130, 20] : [200, 50, 50];

  // Header bar
  doc.setFillColor(10, 12, 20);
  doc.rect(0, 0, W, 70, 'F');
  doc.setFontSize(18); doc.setFont('helvetica', 'bold');
  doc.setTextColor(255,255,255);
  doc.text('UNDERLYTIX', M, 30);
  doc.setFontSize(8); doc.setFont('helvetica', 'normal');
  doc.setTextColor(100,120,180);
  doc.text('LENDER DEAL ASSESSMENT REPORT', M, 45);
  doc.setTextColor(180,180,180);
  doc.text(`Generated: ${deal.date}`, W - M, 45, { align: 'right' });
  doc.text('CONFIDENTIAL', W - M, 30, { align: 'right' });
  y = 95;

  // Parties
  section(doc, 'PARTIES', M, y); y += 18;
  row(doc, 'Lender / Company', profile?.company || '___________________________', M, y); y += 16;
  row(doc, 'Loan Officer',     profile?.name    || '___________________________', M, y); y += 16;
  row(doc, 'Client / Broker',  deal.clientName  || '___________________________', M, y); y += 16;
  row(doc, 'Borrower',         deal.borrowerName|| '___________________________', M, y); y += 28;

  // Property
  section(doc, 'PROPERTY', M, y); y += 18;
  row(doc, 'Address / Folio', deal.address, M, y); y += 16;
  row(doc, 'Loan Product',    deal.loanType, M, y); y += 16;
  row(doc, 'Assessment Date', deal.date, M, y); y += 28;

  // Loan Parameters
  section(doc, 'LOAN PARAMETERS', M, y); y += 18;
  row(doc, 'Purchase Price', fmt(deal.purchasePrice), M, y); y += 16;
  row(doc, 'Loan Amount',    fmt(deal.loanAmount),    M, y); y += 16;
  row(doc, 'Down Payment',   fmt(deal.downPayment) + ` (${((deal.downPayment/deal.purchasePrice)*100).toFixed(0)}%)`, M, y); y += 16;
  row(doc, 'LTV',            (deal.ltv*100).toFixed(1)+'%', M, y); y += 16;
  if (deal.creditScore) { row(doc, 'Credit Score', deal.creditScore, M, y); y += 16; }
  if (deal.exitStrategy) { row(doc, 'Exit Strategy', deal.exitStrategy, M, y); y += 16; }
  if (deal.monthlyRent) { row(doc, 'Monthly Rent', fmt(deal.monthlyRent), M, y); y += 16; }
  if (deal.arv)         { row(doc, 'ARV', fmt(deal.arv), M, y); y += 16; }
  if (deal.rehabBudget) { row(doc, 'Rehab Budget', fmt(deal.rehabBudget), M, y); y += 16; }
  y += 12;

  // Decision
  doc.setFillColor(...color);
  doc.roundedRect(M, y, W - M*2, 38, 5, 5, 'F');
  doc.setFontSize(14); doc.setFont('helvetica', 'bold');
  doc.setTextColor(255,255,255);
  const icon = deal.decision === 'APPROVED' ? '✓' : deal.decision === 'APPROVED WITH CONDITIONS' ? '⚑' : '✗';
  doc.text(`${icon}  ${deal.decision}`, W/2, y+24, { align: 'center' });
  y += 54;

  // Rationale
  section(doc, 'RATIONALE', M, y); y += 18;
  doc.setFontSize(10); doc.setFont('helvetica', 'normal');
  doc.setTextColor(50,50,50);
  const d = deal.decisionData;
  (d?.rationale || []).forEach(r => {
    const lines = doc.splitTextToSize(', ' + r, W - M*2 - 20);
    doc.text(lines, M + 10, y);
    y += lines.length * 14;
  });
  y += 8;

  // Conditions
  if (d?.conditions?.length) {
    section(doc, 'CONDITIONS', M, y); y += 18;
    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.setTextColor(160, 100, 0);
    d.conditions.forEach(c => {
      const lines = doc.splitTextToSize('→ ' + c, W - M*2 - 20);
      doc.text(lines, M + 10, y);
      y += lines.length * 14;
    });
    y += 8;
  }

  // Signature
  y = Math.max(y, 650);
  doc.setDrawColor(210,210,210);
  doc.line(M, y, M+200, y);
  doc.line(M+240, y, M+440, y);
  doc.setFontSize(9); doc.setFont('helvetica', 'normal');
  doc.setTextColor(120,120,120);
  doc.text(profile?.name || 'Loan Officer', M, y+12);
  doc.text('Date', M+240, y+12);
  doc.text('Borrower Signature', M, y+24);

  // Footer
  doc.setFillColor(10, 12, 20);
  doc.rect(0, 750, W, 62, 'F');
  doc.setFontSize(8); doc.setTextColor(100,100,140);
  doc.text('This assessment is for informational purposes only and does not constitute a commitment to lend.', W/2, 768, { align: 'center' });
  doc.text(`© ${new Date().getFullYear()} Underlytix · Confidential`, W/2, 782, { align: 'center' });

  doc.save(`Underlytix_Assessment_${(deal.address||'deal').replace(/[^a-z0-9]/gi,'_')}_${deal.date?.replace(/[^a-z0-9]/gi,'_')}.pdf`);
}

function section(doc, title, x, y) {
  doc.setFontSize(8); doc.setFont('helvetica', 'bold');
  doc.setTextColor(80,100,160);
  doc.text(title, x, y);
  doc.setDrawColor(210,215,230);
  doc.line(x + doc.getTextWidth(title) + 8, y-2, 556, y-2);
}

function row(doc, label, value, x, y) {
  doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.setTextColor(80,80,80);
  doc.text(label, x + 10, y);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(20,20,20);
  doc.text(String(value || ', '), x + 200, y);
}

/* ─── Email ──────────────────────────────────────── */
function emailReport() {
  const subj = encodeURIComponent(`Deal Assessment, ${deal.address}`);
  const d    = deal.decisionData;
  const body = encodeURIComponent([
    `UNDERLYTIX LENDER DEAL ASSESSMENT`,
    ``,
    `Property: ${deal.address}`,
    `Loan Product: ${deal.loanType}`,
    `Borrower: ${deal.borrowerName}`,
    `Client: ${deal.clientName}`,
    `Date: ${deal.date}`,
    ``,
    `DECISION: ${deal.decision}`,
    ``,
    `LOAN PARAMETERS`,
    `Purchase Price: ${fmt(deal.purchasePrice)}`,
    `Loan Amount: ${fmt(deal.loanAmount)}`,
    `Down Payment: ${fmt(deal.downPayment)} (${((deal.downPayment/deal.purchasePrice)*100).toFixed(0)}%)`,
    `LTV: ${(deal.ltv*100).toFixed(1)}%`,
    ``,
    `RATIONALE`,
    ...(d?.rationale || []).map(r => `• ${r}`),
    ...(d?.conditions?.length ? ['', 'CONDITIONS', ...(d.conditions.map(c => `→ ${c}`))] : []),
    ``,
    `This assessment was generated by Underlytix.`,
    `Prepared by: ${profile?.name || ''} · ${profile?.company || ''}`,
  ].join('\n'));
  window.open(`mailto:?subject=${subj}&body=${body}`);
}

/* ─── Deal History ───────────────────────────────── */
function renderSidebar() {
  const list = document.getElementById('deal-list');
  const q    = (document.getElementById('deal-search').value || '').toLowerCase();
  const filtered = deals.filter(d =>
    (d.address||'').toLowerCase().includes(q) ||
    (d.borrower||'').toLowerCase().includes(q) ||
    (d.loanType||'').toLowerCase().includes(q)
  );
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-list">No assessments yet.<br>Start a new deal above.</div>';
    return;
  }
  list.innerHTML = filtered.map(d => `
    <div class="deal-item" onclick="loadDeal(${d.id})">
      <div class="deal-prop" title="${d.address}">${d.address}</div>
      <div class="deal-meta">
        <span class="verdict-dot ${verdictDotClass(d.verdict)}"></span>
        <span>${d.loanType?.split(' ')[0] || ''}</span>
        <span>·</span>
        <span>${d.date || ''}</span>
      </div>
    </div>
  `).join('');
}

function verdictDotClass(v) {
  if (!v) return 'v-pending';
  if (v === 'APPROVED') return 'v-approve';
  if (v.includes('CONDITIONS')) return 'v-conditions';
  return 'v-decline';
}

function filterDeals() { renderSidebar(); }

function loadDeal(id) {
  const rec = deals.find(d => d.id === id);
  if (!rec) return;
  // Load deal back into view (read-only replay)
  deal = { ...rec.deal };
  newChat();
  setTimeout(() => {
    addAI(`Loaded deal: <strong>${rec.address}</strong> · ${rec.borrower}`);
    addAI(`<strong>Decision on file: ${rec.verdict}</strong>`);
    addAI(`Use <em>+ New</em> to run a new assessment.`);
    state = S.DECISION;
    setInputEnabled(false);
  }, 100);
}

/* ─── Session Control ────────────────────────────── */
function newChat() {
  chat.innerHTML = '';
  deal = {};
}

function newAssessment() {
  newChat();
  state = S.PROPERTY;
  deal = {};
  startGreeting();
}

function startGreeting() {
  setTimeout(async () => {
    state = S.PROPERTY;
    await aiSay(
      `Hello${profile?.name ? ', <strong>' + profile.name + '</strong>' : ''}. I'm the Underlytix underwriting assistant.<br><br>` +
      `To get started, enter the <strong>folio number</strong> or <strong>property address</strong> you'd like to assess.`,
      [], 400
    );
  }, 200);
}

/* ─── Utilities ──────────────────────────────────── */
function parseMoney(s) {
  if (!s) return 0;
  const cleaned = s.replace(/[$,\s]/g, '').toLowerCase();
  if (cleaned.endsWith('k')) return parseFloat(cleaned) * 1000;
  if (cleaned.endsWith('m')) return parseFloat(cleaned) * 1000000;
  return parseFloat(cleaned) || 0;
}

function fmt(n) {
  if (!n && n !== 0) return ', ';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function creditToNum(s) {
  if (!s) return 680;
  if (s.includes('Below') || s.includes('620')) return 580;
  if (s.includes('620'))  return 640;
  if (s.includes('660'))  return 680;
  if (s.includes('700'))  return 720;
  return 760;
}

function expToNum(s) {
  if (!s || s.includes('First')) return 0;
  if (s.includes('1-2')) return 1;
  if (s.includes('3-5')) return 3;
  return 6;
}

/* ─── Boot ───────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  if (!profile) {
    // Show profile modal
    document.getElementById('profileModal').classList.remove('hidden');
  } else {
    document.getElementById('header-name').textContent = profile.name;
    startGreeting();
  }
});
</script>
